<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Medicine Supply Scheduler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .header {
      background-color: #4caf50;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .stopwatch {
      font-size: 1.4em;
      text-align: center;
      background: #e0f7fa;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .manual,
    .set-btn,
    .done-btn,
    .reset-btn {
      width: 100%;
      height: 45px;
      margin-top: 10px;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .manual {
      background-color: #ffc107;
    }

    .set-btn {
      background-color: #8bc34a;
      color: white;
    }

    .reset-btn {
      background-color: #e57373;
      color: white;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 60px;
      padding: 5px;
      font-size: 16px;
      margin-right: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .status {
      font-size: 14px;
      font-weight: bold;
      padding-left: 10px;
      white-space: nowrap;
    }

    .status.running {
      color: #2196f3;
    }

    .status.done {
      color: green;
    }

    .status.scheduled {
      color: orange;
    }

    .status.expired {
      color: red;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Medicine Supply Scheduler</h1>
    <p>Enter Patient's Medicine Supply Timetable</p>
  </div>

  <div class="stopwatch" id="stopwatchDisplay">Stopwatch: 00:00:00.000</div>

  <div class="card">
    <h2>Manual Trigger</h2>
    <button class="manual" id="manualTriggerBtn" onclick="triggerLoop()">Run Stepper Motor and Vibrating Loop</button>
  </div>

  <div class="card">
    <h2>Set Time (hours and minutes)</h2>
    <form id="scheduleForm" onsubmit="return false;">
      <div id="time-slots-container"></div>
      <button class="set-btn" type="button" onclick="addSlot()">+ Add Time Slot</button>
    </form>
    <button class="set-btn" id="setBtn" onclick="setSchedule()">Set Schedule</button>
    <button class="reset-btn" type="button" onclick="resetAll()">Reset All</button>
  </div>

  <script>
    let slotCounter = 0;
    const MAX_SLOTS = 12;
    const scheduled = Array(MAX_SLOTS).fill(false);
    const triggered = Array(MAX_SLOTS).fill(false);
    const expired = Array(MAX_SLOTS).fill(false);
    const running = Array(MAX_SLOTS).fill(false);
    const triggerTimes = Array(MAX_SLOTS).fill(0);
    const originalDelays = Array(MAX_SLOTS).fill(0);
    const container = document.getElementById("time-slots-container");
    const startTime = Date.now();

    function formatTime(ms) {
      let hours = Math.floor(ms / 3600000);
      ms %= 3600000;
      let minutes = Math.floor(ms / 60000);
      ms %= 60000;
      let seconds = Math.floor(ms / 1000);
      ms %= 1000;

      return (hours < 10 ? "0" : "") + hours + ":" +
        (minutes < 10 ? "0" : "") + minutes + ":" +
        (seconds < 10 ? "0" : "") + seconds + "." +
        (ms < 100 ? (ms < 10 ? "00" : "0") : "") + ms;
    }

    function updateStopwatch() {
      document.getElementById("stopwatchDisplay").innerText =
        "Stopwatch: " + formatTime(Date.now() - startTime);
    }

    function triggerLoop() {
      const btn = document.getElementById("manualTriggerBtn");
      btn.disabled = true;
      btn.innerText = "Running...";
      setTimeout(() => {
        btn.disabled = false;
        btn.innerText = "Run Stepper Motor and Vibrating Loop";
      }, 4000);
    }

    function createSlot(index, hours = "", minutes = "") {
      if (slotCounter >= MAX_SLOTS) return;

      const div = document.createElement("div");
      div.className = "time-row";
      div.innerHTML = `
        <div>
          <label>Input ${slotCounter + 1}:</label>
          <input type="hidden" value="${index}">
          <input type="number" class="hour-input" placeholder="hr" min="0" value="${hours}">
          <input type="number" class="min-input" placeholder="min" min="0" value="${minutes}">
        </div>
        <span class="status" id="status${index}"></span>
      `;
      container.appendChild(div);
      slotCounter++;
      updateStatus(index);
    }

    function addSlot() {
      if (slotCounter >= MAX_SLOTS) {
        alert("Maximum of 12 time slots reached.");
        return;
      }

      let nextIndex = 0;
      while (nextIndex < MAX_SLOTS) {
        const isUsed = Array.from(container.querySelectorAll("input[type=hidden]"))
          .some(input => parseInt(input.value, 10) === nextIndex);
        if (!isUsed) break;
        nextIndex++;
      }

      if (nextIndex < MAX_SLOTS) createSlot(nextIndex);
    }

    function setSchedule() {
      const slots = document.querySelectorAll(".time-row");
      slots.forEach(slot => {
        const index = parseInt(slot.querySelector("input[type=hidden]").value, 10);
        const h = parseInt(slot.querySelector(".hour-input").value || "0", 10);
        const m = parseInt(slot.querySelector(".min-input").value || "0", 10);
        const totalMinutes = h * 60 + m;

        if (totalMinutes > 0) {
          scheduled[index] = true;
          triggered[index] = false;
          expired[index] = false;
          running[index] = false;
          triggerTimes[index] = Math.floor(Date.now() / 1000) + totalMinutes * 60;
          originalDelays[index] = totalMinutes;
        }

        updateStatus(index);
      });
    }

    function resetAll() {
      scheduled.fill(false);
      triggered.fill(false);
      expired.fill(false);
      running.fill(false);
      triggerTimes.fill(0);
      originalDelays.fill(0);
      container.innerHTML = "";
      slotCounter = 0;
      addSlot();
    }

    function updateStatus(index) {
      const el = document.getElementById("status" + index);
      if (!el) return;

      if (running[index]) {
        el.innerText = "Running";
        el.className = "status running";
      } else if (triggered[index]) {
        el.innerText = "Done";
        el.className = "status done";
      } else if (scheduled[index]) {
        el.innerText = "Scheduled";
        el.className = "status scheduled";
      } else if (expired[index]) {
        el.innerText = "Expired";
        el.className = "status expired";
      } else {
        el.innerText = "";
        el.className = "status";
      }
    }

    function updateRemainingTimes() {
      const now = Math.floor(Date.now() / 1000);
      for (let i = 0; i < triggerTimes.length; i++) {
        if (scheduled[i] && triggerTimes[i] > now) {
          const remaining = triggerTimes[i] - now;
          const hours = Math.floor(remaining / 3600);
          const minutes = Math.floor((remaining % 3600) / 60);
          const seconds = remaining % 60;
          const statusEl = document.getElementById(`status${i}`);
          if (statusEl) {
            statusEl.setAttribute("title", `${hours}h ${minutes}m ${seconds}s remaining`);
          }
        }
      }
    }

    addSlot();
    setInterval(updateRemainingTimes, 1000);
    setInterval(updateStopwatch, 100);
  </script>
</body>
</html>
